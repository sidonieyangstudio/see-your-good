<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看見你的好</title>
<meta name="description" content="記下孩子做到的小事，出門前一起約好。內容只存在這支手機。">
<meta name="theme-color" content="#FFF3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="看見你的好">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{--top:0px}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Bpmf+Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#FEFBF9;--bar:#FFF3EE;--ink:#5E5453;--soft:#7A6E6D;--accent:#DA844F;--rose:#C78E78;--blush:#F7DCD1;--leaf:#7FA36B;--bad:#D9776B;--star:#F2AE52;--pink:#F0ABA5;--lilac:#E8C3D8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","PingFang TC","Heiti TC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.nw{white-space:nowrap}

.tabs{position:sticky;top:0;z-index:40;display:flex;justify-content:center;background:var(--bg);padding:8px 8px;border-bottom:1px solid var(--blush)}
.track{display:inline-flex;background:var(--bar);padding:3px;border-radius:99px;gap:2px;max-width:100%}
.track button{padding:6px 11px;border-radius:99px;font-size:15px;color:var(--soft);white-space:nowrap}
.track button.on{background:#fff;color:var(--ink);box-shadow:0 3px 14px rgba(94,84,83,.1)}
.pane{display:none}.pane.on{display:block}
#try{display:flex;justify-content:center;padding:0}
.frame{position:relative;width:100%;height:calc(100dvh - var(--top,51px));overflow:hidden;background:var(--bg)}
@media (min-width:600px){#try{padding:22px}.frame{width:390px;height:780px;border-radius:34px;border:8px solid #fff;box-shadow:0 0 0 2px var(--blush),0 16px 44px rgba(94,84,83,.14)}}
.doc{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
.doc h2{font-size:24px;margin:30px 0 8px;font-weight:400}
.doc h3{font-size:18px;margin:22px 0 8px;font-weight:400;color:var(--rose)}
.doc p{font-size:16px;line-height:1.75;margin:6px 0;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.mini-wrap .capn{font-size:15px;text-align:center;margin:9px 0 2px}
.mini-wrap .sub{font-size:13px;text-align:center;color:var(--soft);line-height:1.5}
.mini{position:relative;width:100%;aspect-ratio:390/780;border-radius:20px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 2px var(--blush);container-type:inline-size}
.mini>.inner{position:absolute;left:0;top:0;width:390px;height:780px;transform-origin:0 0;pointer-events:none}
.sw{display:flex;flex-wrap:wrap;gap:12px}.sw div{width:96px;font-size:13px;line-height:1.4;color:var(--soft)}.sw i{display:block;height:60px;border-radius:14px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(94,84,83,.08)}
.demo{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card-doc{background:#fff;border:2px solid var(--blush);border-radius:18px;padding:14px 16px;margin:10px 0}
.card-doc li{font-size:16px;line-height:1.7;margin:3px 0;text-wrap:pretty}
.card-doc ul{margin:4px 0;padding-left:20px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;font-size:15px;line-height:1.6}.ba>div{padding:9px 11px;border-radius:12px;background:#fff;border:1.5px solid var(--blush)}.ba>div:last-child{background:var(--bar)}
.doc a{color:#DA844F}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{flex:none;height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--blush);gap:8px}
.bk{font-size:16px;color:var(--soft);white-space:nowrap}
.bar .r{display:flex;align-items:center;gap:10px;margin-left:auto}
.seg{display:inline-flex;background:var(--blush);padding:3px;border-radius:99px}
.seg button{padding:4px 10px;border-radius:99px;font-size:15px;color:var(--soft);line-height:1.2}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 14px rgba(94,84,83,.1)}
.lockb{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--blush);color:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}.lockb.on{background:var(--rose);box-shadow:none;color:#fff}
.pin{letter-spacing:.5em;text-align:center;font-size:26px;padding:10px;width:190px}
.pmode{align-self:center;font-size:14px;color:#fff;background:var(--rose);padding:3px 12px;border-radius:99px}
.linkb{align-self:center;font-size:14px;color:var(--soft);text-decoration:underline;padding:4px}
.zysw{display:flex;align-items:center;gap:5px;font-size:15px;white-space:nowrap}
.sw2{width:40px;height:23px;border-radius:99px;background:var(--blush);position:relative;transition:.15s}
.sw2::after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(94,84,83,.25);transition:.15s}
.sw2.on{background:var(--rose)}.sw2.on::after{left:20px}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px;-webkit-overflow-scrolling:touch}
.body>*{flex-shrink:0}
.foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:var(--bg)}
h1{margin:0;font-size:26px;font-weight:400;text-align:center;line-height:1.4;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:0;text-align:center;font-size:16px;line-height:1.7;color:var(--soft);text-wrap:balance}
.btn{flex:1.25;display:block;width:100%;background:var(--accent);color:#fff;border-radius:16px;font-size:21px;padding:12px;text-align:center;transition:scale .1s;text-wrap:balance}
.btn:active,.chip:active,.bigc:active{scale:.95}
.btn[disabled],.btn.wait{background:var(--blush);color:var(--ink);cursor:default}
.btn.ghost{flex:1;background:#fff;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-size:18px;padding:10px}
.logo{display:block;height:28px;margin:0 auto}

.sq{display:block;width:92px;height:92px;object-fit:contain;margin:0 auto -4px}
.bigc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--blush);border-radius:24px;padding:16px;transition:scale .1s}
.bigc .art{flex:none;width:96px;height:96px;border-radius:18px;background:var(--blush);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bigc b{display:block;font-weight:400;font-size:24px;line-height:1.35;text-wrap:balance}
.bigc>span:not(.art)>span{display:block;font-size:15px;color:var(--soft);line-height:1.6;margin-top:3px;text-wrap:balance}
.smalllink{align-self:center;font-size:15px;color:var(--soft);padding:6px}

.mach{--k:1;position:relative;width:calc(219px*var(--k));height:calc(343px*var(--k));margin:2px auto 0}
.mi{position:absolute;left:0;top:0;width:1024px;height:1536px;transform:scale(calc(.27*var(--k))) translate(-100px,-140px);transform-origin:0 0}
.mg,.mg>img{position:absolute;left:0;top:0;width:1024px;height:1536px}
.mg>img{display:block;max-width:none}
.mshadow{position:absolute;left:150px;top:1370px;width:720px;height:50px;border-radius:50%;background:rgba(94,84,83,.14)}
.pile{position:absolute;left:0;top:0;width:1024px;height:1536px;clip-path:circle(378px at 506px 620px)}
.pile .cap{filter:drop-shadow(0 3px 5px rgba(94,84,83,.35))}
.pile.idle .cap{animation:bob var(--t,3s) ease-in-out var(--d,0s) infinite alternate}
@keyframes bob{from{translate:0 0}to{translate:0 -9px}}
.cap{position:absolute;display:block;border-radius:50%;overflow:hidden}
.cap::before,.cap::after{content:"";position:absolute;left:0;right:0;height:50%;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.cap::before{top:0}.cap::after{top:50%}
.m_knob{transform-origin:346px 1153px}
.m_lid{transform-origin:513px 345px}

.hit{position:absolute;padding:0;border:0;background:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.glasshit{left:calc(7.6px*var(--k));top:calc(27.6px*var(--k));width:calc(204px*var(--k));height:calc(204px*var(--k));border-radius:50%}
.lidhit{left:calc(58px*var(--k));top:0;width:calc(106px*var(--k));height:calc(56px*var(--k));border-radius:40% 40% 30% 30%}
.knobhit{left:calc(26px*var(--k));top:calc(233px*var(--k));width:calc(80px*var(--k));height:calc(80px*var(--k));border-radius:50%}

.kbub{position:absolute;right:calc(100% - 28px*var(--k));top:calc(273px*var(--k));translate:0 -50%;background:#fff;color:var(--ink);font-size:18px;line-height:1.3;padding:7px 12px;border-radius:16px;white-space:nowrap;box-shadow:0 4px 14px rgba(94,84,83,.22);pointer-events:none;animation:kb 1.6s ease-in-out infinite}
.kbub::after{content:"";position:absolute;right:-7px;top:50%;translate:0 -50%;border:7px solid transparent;border-left:9px solid #fff;border-right:0}
@keyframes kb{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.mbody{justify-content:center}
@media (min-height:720px){.mbody .mach{--k:1.12}}
.mg{transform-origin:512px 1400px}
.dropclip{position:absolute;left:0;top:0;width:1024px;height:1536px;clip-path:polygon(46.88% 73.57%,78.12% 73.57%,78.12% 100%,46.88% 100%)}
.drop{left:575px;top:1178px;width:130px;height:130px;animation:dr .78s linear forwards}
@keyframes dr{0%{translate:12px -170px;rotate:-170deg;scale:.92;animation-timing-function:cubic-bezier(.5,0,.9,.5)}52%{translate:0 0;rotate:-20deg;scale:1.12 .86;animation-timing-function:cubic-bezier(.2,.7,.4,1)}70%{translate:0 -34px;rotate:0deg;scale:.97 1.04;animation-timing-function:cubic-bezier(.6,0,.9,.5)}84%{translate:0 0;scale:1.06 .94;animation-timing-function:cubic-bezier(.2,.7,.4,1)}92%{translate:0 -9px;scale:1}100%{translate:0 0;rotate:0deg;scale:1;opacity:1}}
.into{left:441px;top:230px;width:130px;height:130px;animation:inn .7s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes inn{0%{translate:0 0}70%{translate:0 500px}85%{translate:0 450px}100%{translate:0 500px}}
.shopb{display:flex;align-items:flex-end;aspect-ratio:1/.92;background:var(--blush);border-radius:12px;padding:6px}
.shop{position:relative;display:block;width:100%;container-type:inline-size;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff)}
.shop img{display:block;width:100%}
.sg{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--ink);white-space:nowrap;overflow:hidden}
.sg>span{display:block;line-height:1.1;position:relative;top:.04em;font-size:11cqw}
.glow{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff)}
.fold{width:96px;animation:pp .35s cubic-bezier(.2,1.5,.4,1)}

.stage img{display:block;max-width:100%;max-height:100%}
@keyframes stg{from{scale:.72 .55;opacity:.4}}
.ovbar{position:absolute;top:0;left:0;right:0;height:55px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 12px;z-index:3}
.wact{display:flex;gap:8px;width:min(100%,330px)}
.wact .btn{padding:10px 6px;font-size:17px}
.btn.danger{background:var(--accent);color:#fff;box-shadow:none}
.paper textarea{width:100%;margin-top:10px;font-size:18px}
.noteHold{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;visibility:hidden}
.noteHold.show{visibility:visible}
.noteHold.show .paper.note .m,.noteHold.show .paper.note .d,.noteHold.show .paper.note .from{animation:fi .22s}
.noteHold.show .star{animation:pp .4s cubic-bezier(.2,1.5,.4,1)}
.noteHold.show .paper.note{animation:settle .26s cubic-bezier(.2,.8,.3,1)}
@keyframes settle{0%{scale:1.035 .95}55%{scale:.99 1.02}100%{scale:1 1}}
.noteHold.show .noteBtn{animation:fi .25s}
.noteBtn{display:flex;width:min(100%,330px)}
.stage img.foldIn{width:100px;animation:stg .34s cubic-bezier(.2,1.5,.4,1)}
.stage img:not(.foldIn){width:100%}
.wiggle{animation:wg 1.6s ease-in-out .55s infinite}
@keyframes wg{0%,70%,100%{rotate:0deg}78%{rotate:-6deg}86%{rotate:6deg}94%{rotate:-3deg}}
.tap{font-size:18px;color:var(--soft)}
.paper{position:relative;width:min(100%,330px);background:#fff;border:2px solid var(--blush);border-radius:18px;padding:20px 20px 16px;box-shadow:0 12px 34px rgba(94,84,83,.13)}
.paper.pop{animation:pp .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pp{from{scale:.2;opacity:0;rotate:-6deg}}
.paper .d{font-size:14px;color:var(--soft);display:flex;justify-content:space-between;gap:10px}
.paper .m{font-size:22px;line-height:1.7;margin:12px 0 14px;text-wrap:balance}
.paper .from{font-size:15px;color:var(--rose);text-align:right}
.star{width:44px;display:block;margin:0 auto}
.spark{position:absolute;pointer-events:none;border-radius:3px;z-index:25}

.label{font-size:15px;color:var(--soft);margin:0;text-wrap:balance}
textarea,.inp{width:100%;background:#fff;border:2px solid var(--blush);border-radius:16px;padding:12px;font-size:18px;line-height:1.6;outline:0;resize:none}
.inp{display:block;min-width:0;max-width:100%}
input[type=time].inp{-webkit-appearance:none;appearance:none;min-height:54px;text-align:left}
input[type=time].inp::-webkit-date-and-time-value{text-align:left}
textarea:focus,.inp:focus{border-color:var(--rose)}
.hint{font-size:14px;line-height:1.6;color:var(--soft);margin:0;text-wrap:pretty}
.tip{font-size:15px;line-height:1.6;background:var(--bar);border-radius:12px;padding:9px 12px;margin:0;text-wrap:pretty}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs2::-webkit-scrollbar{display:none}
.tab2{flex:none;font-size:15px;padding:5px 11px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--blush);color:var(--soft)}
.tab2.on{background:var(--bar);box-shadow:inset 0 0 0 2px var(--rose);color:var(--ink)}
.ghosts{display:flex;flex-direction:column;gap:7px}
.gh{display:block;width:100%;text-align:left;font-size:16px;line-height:1.55;color:#8d8280;background:#fbf7f5;border:1.5px dashed #e5d7d0;border-radius:13px;padding:9px 12px;text-wrap:pretty}
.gh::before{content:"＋ ";color:var(--rose)}

.book{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.mon{font-size:19px;margin:4px 0 -2px;font-weight:400}
.bk1{background:var(--blush);border-radius:14px;padding:9px 2px 6px;text-align:center;font-size:13px;color:var(--soft)}
.bk1 .cap{position:relative;display:block;width:46px;height:46px;margin:0 auto 4px;box-shadow:0 0 0 2px #fff}

.places{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pl{position:relative;display:block;background:#fff;border:2px solid var(--blush);border-radius:20px;padding:8px;text-align:center;transition:scale .1s}
.pl:active{scale:.96}
.pl{min-height:128px}
.pl.add{border-style:dashed;background:transparent;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;font-size:16px}
.pl.add b{font-weight:400;font-size:32px;color:var(--rose);line-height:1}
.edit{position:absolute;right:10px;bottom:10px;font-size:13px;color:var(--ink);background:#fff;border-radius:99px;padding:2px 8px}

.steps{display:flex;justify-content:center;gap:6px}.steps i{width:30px;height:6px;border-radius:9px;background:var(--blush)}.steps i.on{background:var(--rose)}
.rowt{font-size:17px;margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{background:#fff;box-shadow:inset 0 0 0 2px var(--blush);border-radius:14px;padding:8px 4px;font-size:15px;line-height:1.3;text-align:center;transition:scale .1s}
.chip.on{background:var(--bar);box-shadow:inset 0 0 0 2px var(--rose)}
.chip.warn.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ru{display:flex;gap:11px;align-items:flex-start;background:#fff;border:2px solid var(--blush);border-radius:16px;padding:12px;font-size:17px;line-height:1.6;width:100%;text-align:left;text-wrap:pretty}
.ru.on{background:var(--bar);border-color:var(--rose)}
.ck{flex:none;width:30px;height:30px;border-radius:11px;border:2px solid var(--rose);background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .12s,border-color .12s}
.ck svg{width:100%;height:100%;display:block;overflow:visible}
.ru.on .ck,.ck.done{background:var(--accent);border-color:var(--accent)}
.ru.big .ck{width:34px;height:34px;border-radius:13px}
.lastnote{font-size:15px;line-height:1.6;background:#fff;border:2px dashed var(--rose);border-radius:14px;padding:9px 12px;margin:0;text-wrap:pretty}
.big{font-size:21px;padding:14px}
.rm{flex:none;margin-left:auto;color:var(--soft);font-size:20px;line-height:1;padding:2px 3px}
.stat.flash{color:var(--accent);animation:pp .3s cubic-bezier(.2,1.5,.4,1)}
.toast{position:absolute;left:50%;bottom:92px;translate:-50% 0;z-index:30;background:var(--ink);color:#fff;font-size:15px;padding:8px 14px;border-radius:99px;white-space:nowrap;animation:fi .2s}
.outb{display:flex;flex-direction:column;gap:8px;background:var(--bar);border:2px solid var(--rose);border-radius:18px;padding:12px}
.outb b{font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}
.outb b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.outb span{font-size:15px;color:var(--soft);line-height:1.5}
.outb .row{display:flex;gap:8px}.outb .btn{font-size:18px;padding:9px}.outb .btn.ghost{font-size:16px;padding:7px}
.notif{position:absolute;left:10px;right:10px;top:10px;z-index:35;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(94,84,83,.22);padding:11px 13px;font-size:15px;line-height:1.5;text-align:left;animation:nd .3s}
.notif small{display:block;color:var(--soft);font-size:12px}
@keyframes nd{from{translate:0 -24px;opacity:0}}
.wallv{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wallv,.tabs2,.starbox{overscroll-behavior-x:contain}
.wallv::-webkit-scrollbar{display:none}.wallv::after{content:"";flex:0 0 32px}
.wall{flex:0 0 calc(100% - 24px);scroll-snap-align:start;display:flex;align-items:flex-start;gap:7px;min-height:200px;background:var(--blush);border-radius:18px;padding:9px}
.wcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.wall:only-child{flex:0 0 100%}.wallv:has(.wall:only-child)::after{display:none}
.wall .hint{flex:1;align-self:center;text-align:center}
.wdots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 8px}
.wdots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:var(--blush);box-shadow:inset 0 0 0 1px rgba(199,142,120,.45)}
.wdots button.on{background:var(--accent);box-shadow:none}
.starbox{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;min-height:50px;flex:none}
.starbox::-webkit-scrollbar{display:none}
.starbox .sn{flex:none;font-size:15px;color:var(--soft);margin-right:2px}
.starb{flex:none;width:44px;height:44px;padding:0;border:0;background:none}.starb img{width:100%;height:100%;display:block}
.starb.new{animation:pp .5s cubic-bezier(.2,1.5,.4,1)}
.starlist{display:flex;flex-direction:column;gap:7px;max-height:42vh;overflow-y:auto;text-align:left}
.starlist p{margin:0;font-size:16px;line-height:1.5}
.sf{position:absolute;inset:0;z-index:40;overflow:hidden;background:rgba(254,251,249,.92);animation:fi .25s;transition:background .5s}
.sf.out{background:rgba(254,251,249,0)}
.sfc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.sfstar{position:absolute;display:block;max-width:none;z-index:2}
.sfmsg{position:absolute;left:24px;right:24px;margin:0;text-align:center;font-size:23px;line-height:1.4;color:var(--ink);text-wrap:balance;opacity:0;translate:0 12px;transition:opacity .25s,translate .35s cubic-bezier(.2,1.5,.4,1)}
.sfmsg.on{opacity:1;translate:0 0}
.coach{position:absolute;inset:0;z-index:60}
.coach.dim{background:rgba(94,84,83,.5)}
.chole{position:absolute;border-radius:18px;box-shadow:0 0 0 2000px rgba(94,84,83,.5),0 0 0 3px #fff;transition:none}
.cbub{position:absolute;left:14px;right:14px;background:#fff;border-radius:20px;padding:14px 16px 12px 66px;box-shadow:0 10px 30px rgba(94,84,83,.28);display:flex;flex-direction:column;gap:9px;min-height:84px}
.cbub img{position:absolute;left:8px;top:12px;width:54px;height:auto}
.cbub p{margin:0;font-size:16px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.crow{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.cskip{font-size:14px;color:var(--soft);padding:6px 2px;white-space:nowrap}
.btn.cnext{flex:none;padding:7px 18px;font-size:16px;min-height:0;width:auto}
.wn.sel{outline:3px solid var(--accent);outline-offset:1px;position:relative}
.wn.sel::after{content:"✓";position:absolute;right:-5px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;line-height:20px;text-align:center}
.trz{display:block}.tr{display:block;font-size:.84em;color:var(--soft);line-height:1.4;margin-top:3px}
.wn{display:block;width:100%;min-height:58px;padding:7px;word-break:normal;border-radius:4px;font-size:13px;line-height:1.45;text-align:left;text-wrap:pretty;border:1.5px solid rgba(199,142,120,.45);box-shadow:0 2px 5px rgba(94,84,83,.22)}
.wn.t0{background:#fff;rotate:-1.3deg}.wn.t1{background:#F2E4CF;rotate:1deg}.wn.t2{background:#FFF3EE;rotate:1.4deg}
.etas{grid-template-columns:repeat(4,1fr)}
@media (max-width:340px){.etas{grid-template-columns:repeat(2,1fr)}}
.stat{margin:0;text-align:center;font-size:16px;color:var(--soft)}
.tag{align-self:center;font-size:13px;color:var(--soft);background:var(--bar);padding:3px 10px;border-radius:99px;text-align:center}
@media (max-width:340px){.bigc .art{width:76px;height:76px}.bigc b{font-size:21px}.mach{--k:.85}.seg button{padding:4px 7px}.bk{font-size:15px}}
@media (max-height:640px){.sq{width:66px;height:66px}.mach{--k:.8}.bigc{padding:11px}.bigc .art{width:70px;height:70px}}

@media (max-width:599px){
 .frame{height:auto;min-height:calc(100dvh - var(--top,51px));overflow:visible}
 #app>.scr{position:relative;inset:auto;min-height:calc(100dvh - var(--top,51px))}
 #app>.scr>.body{flex:1 0 auto;overflow:visible}
 #app>.scr>.foot{position:sticky;bottom:0;z-index:5;border-top:1px solid var(--blush)}
 #app>.scr>.foot+.foot{position:static;border-top:0}
 body.typing #app>.scr>.foot{position:static;border-top:0}
 body.typing #app>.scr{padding-bottom:45vh}
 #app>.ov{position:fixed;top:0;left:0;right:0;bottom:0}
 #app>.sf{position:fixed;top:0;left:0;right:0;bottom:0}
 #app>.coach{position:fixed;top:0;left:0;right:0;bottom:0}
 #app{overflow-x:clip}
 .toast{position:fixed}.notif{position:fixed}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

function loadAud(){if(audLoading||!ac)return;audLoading=true;Object.keys(AUD).forEach(k=>{const bin=atob(AUD[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);ac.decodeAudioData(u.buffer,b=>{audBuf[k]=b},()=>{})})}
function playAud(k,v){const b=audBuf[k];if(!ac||!b)return;const n=ac.createBufferSource(),g=ac.createGain();n.buffer=b;g.gain.value=v||1;n.connect(g).connect(out());n.start()}

const crank=()=>{for(let i=0;i<TICKS;i++){const t=(ANT+i*TURN/TICKS)/1000;tone(330,190,.04,"square",.022,t);tone(210,140,.05,"triangle",.06,t)}playAud("A",.95)};
const rollDown=()=>{for(let i=0;i<4;i++)tone(460-i*40,390-i*40,.07,"triangle",.06,i*.08)};
const clunk=()=>{if(audBuf["掉落"])playAud("掉落",1);else{tone(240,120,.14,"triangle",.16);tone(200,110,.09,"triangle",.07,.2)}};
const clack=()=>{for(let i=0;i<4;i++){const f=900+Math.random()*700;tone(f,f*.8,.03,"triangle",.05,i*.06+Math.random()*.03)}};
const win=()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,f,.2,"sine",.13,i*.08));tone(2093,2350,.25,"triangle",.06,.34)};
document.addEventListener("click",e=>{wake();loadAud()},true);
function spark(host,x,y){const cs=["#F6B35A","#DA844F","#F0ABA5","#E8C3D8"];if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<14;i++){const s=document.createElement("i"),a=Math.PI*2*i/14,r=70+Math.random()*50,z=12+Math.random()*10;s.className="spark";s.style.cssText=`left:${x}px;top:${y}px;width:${z}px;height:${z}px;background:${cs[i%4]}`;host.append(s);s.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) rotate(180deg)`,opacity:0}],{duration:760,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove()}}

function capHTML(c,cls,st){return `<span class="cap c${Math.max(0,COLORS.indexOf(c))} ${cls||""}" style="${st||""}"></span>`}
const shopArt=(t,name)=>{const g=SIGNS[t]||SIGNS.other;return `<span class="shop"><img src="${IMG["shop_"+t]||IMG.shop_other}" alt=""><span class="sg" style="left:${g.l}%;top:${g.t}%;width:${g.w}%;height:${g.h}%"><span>${esc(name||"")}</span></span></span>`};

function fitSigns(root){root.querySelectorAll(".sg").forEach(b=>{const t=b.firstElementChild,H=b.clientHeight,W=b.clientWidth;if(!H||!W||!t)return;let z=Math.min(Math.round(H*.7),Math.max(9,Math.round(b.parentElement.clientWidth*.125)));t.style.fontSize=z+"px";while(z>8&&t.offsetWidth>W*.86){z-=.5;t.style.fontSize=z+"px"}})}

function clipName(v){let n=0,o="";for(const c of v){n+=/[\x00-\x7f]/.test(c)?1:2;if(n>12)break;o+=c}return o}

function machine(n,cls){const list=caps.filter(c=>!c.opened);let h="";for(let i=0;i<Math.min(n,PILE.length);i++){h+=capHTML(list[i].color,"",`left:${PILE[i][0]-65}px;top:${PILE[i][1]-65}px;width:130px;height:130px;rotate:${i*47}deg;--t:${2.4+(i%4)*.5}s;--d:-${(i*.7)%3}s`)}return `<div class="mach ${cls||""}" id="mach"><div class="mi"><span class="mshadow"></span><div class="mg" id="mg"><img src="${IMG.m_body}" alt=""><img src="${IMG.m_back}" alt=""><div class="pile idle">${h}</div><img class="m_front" src="${IMG.m_front}" alt=""><img class="m_lid" src="${IMG.m_lid}" alt=""><img class="m_knob" src="${IMG.m_knob}" alt=""><img class="m_cover" src="${IMG.m_cover}" alt=""><img class="m_lip" src="${IMG.m_lip}" alt=""></div></div><button class="hit glasshit" data-act="knock" aria-label="${T("敲敲玻璃","Tap the glass")}"></button><button class="hit lidhit" data-act="lid" aria-label="${T("點點蓋子","Tap the lid")}"></button><button class="hit knobhit" data-act="knob" aria-label="${T("轉旋鈕","Turn the knob")}"></button>${cls&&cls.includes("can")&&!S.knobOK?`<span class="kbub" aria-hidden="true">${T("轉我！","Turn me!")}</span>`:""}</div><p class="stat" style="margin-top:6px">${T(n+" 顆等你打開",n+" waiting for you")}</p>`}
function paper(c,popCls){return `<div class="paper note ${popCls||""}"><div class="d"><span>${esc(c.date)}</span><span>${T("寫給你的字條","A note for you")}</span></div><p class="m">${both(c)}</p><div class="from">${T(esc(c.by)+"寫的","From "+esc(BY_EN[c.by]||c.by))}</div></div>`}
function ifLabel(p){return p.type==="school"?T("如果今天很難做到","If today is hard"):T("如果沒做到","If it doesn't work out")}
const etaSet=p=>DATA.etas[p.type==="school"?"school":"default"];
function remindAt(p){const e=etaSet(p)[S.eta];if(!e||e.none)return "";if(e.end!==undefined){if(!p.schoolEnd)return "";const[h,m]=p.schoolEnd.split(":").map(Number),x=h*60+m+e.end;return Math.floor(x/60)%24+":"+String(x%60).padStart(2,"0")}if(e.custom)return S.etaT||"";const d=new Date(Date.now()+e.h*36e5);return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
function outBanner(){if(!S.out)return "";const p=places[S.out.place];return `<div class="outb"><b>${S.overdue?T("還沒記：","To record: "):T("出門中：","Out now: ")}${esc(pn(p))}</b><span>${S.overdue?T("回來了嗎？花 30 秒記一下，也可以略過。","Back yet? Take 30 seconds, or skip it."):T(S.out.time+" 出發","Left at "+S.out.time)+(S.out.remind?T("，"+S.out.remind+" 提醒","; reminder at "+S.out.remind):T("，不提醒","; no reminder"))}</span><div class="row"><button class="btn" data-go="back">${T("我們回來了","We're back")}</button><button class="btn ghost" data-go="out">${T("看約定","Promises")}</button></div></div>`}

 <button class="bigc" data-go="places"><span class="art" style="padding:8px">${shopArt("market",T("出門","Go"))}</span><span><b>${T("我們要出門","We're going out")}</b><span>${T("出發前，先一起約好。","Make a promise before we go.")}</span></span></button>
 <button class="bigc" data-go="machine"><span class="art"><img class="glow" src="${IMG.home_good}" alt="" style="width:69%"></span><span><b>${T("看見你的好","The good I saw")}</b><span>${T("放一顆扭蛋，或打開一顆。","Add a capsule, or open one.")}</span></span></button>

 <textarea id="zh" rows="3" placeholder="${T("打字，或按鍵盤上的麥克風直接說。","Type, or tap the mic on your keyboard.")}">${esc(S.zh)}</textarea>
 ${w?`<p class="tip">${T("可以再多寫一句：孩子實際做了什麼？這樣打開時會更有畫面。","Add one more line: what exactly did your child do?")}</p>`:""}

 <div class="foot"><button class="btn" data-act="save" ${S.zh.trim()?"":"disabled"}>${ed?T("存好了","Save"):T("放進扭蛋機","Add to the machine")}</button></div></div>`},
book(){const op=caps.filter(c=>c.opened);const months={};op.forEach(c=>{const m=String(c.date).split("/")[0];(months[m]=months[m]||[]).push(c)});const keys=Object.keys(months).sort((a,b)=>b-a);return `<div class="scr">${bar("machine")}<div class="body"><h1>${T("我的<em>收藏冊</em>","My <em>collection</em>")}</h1><p class="lead">${op.length?T("已經打開 "+op.length+" 顆，點一顆再看一次。","You've opened "+op.length+". Tap one to read it again."):T("打開過的扭蛋，都會收在這裡。","Opened capsules stay here.")}</p>${keys.map(m=>`<h2 class="mon">${T(m+" 月","Month "+m)}</h2><div class="book">${months[m].map(c=>`<button class="bk1" data-read="${caps.indexOf(c)}">${capHTML(c.color)}${esc(c.date)}</button>`).join("")}</div>`).join("")}</div></div>`},
places(){return `<div class="scr">${bar("home")}<div class="body">${outBanner()}${S.editing?`<span class="pmode">${T("編輯中：點一家店來修改","Editing: tap a place")}</span>`:""}<h1>${S.editing?T("要修改哪裡？","Which place?"):T("今天要<em>去哪裡</em>？","Where are we <em>going</em>?")}</h1><div class="places">${places.map((p,i)=>`<button class="pl" data-place="${i}"><span class="shopb">${shopArt(p.type,pn(p))}</span></button>`).join("")}<button class="pl add" data-go="newplace"><b>＋</b>${T("新增地方","Add a place")}</button></div></div><div class="foot"><button class="btn ghost" data-act="editmode">${S.editing?T("編輯完成","Done editing"):T("編輯地方","Edit places")}</button></div></div>`},
newplace(){const ks=Object.keys(DATA.types);return `<div class="scr">${bar("places")}<div class="body"><h1 style="font-size:23px">${T("新增一個地方","Add a place")}</h1><div class="pl" style="width:150px;align-self:center"><span class="shopb">${shopArt(ks[S.addType],S.newName||T("店名","Name"))}</span></div><p class="label">${T("招牌上的名字（最多 6 個中文字或 12 個英文字）","Sign name (up to 12 letters)")}</p><input class="inp" id="nn" value="${esc(S.newName)}" placeholder="${T("例如：家附近的超市","e.g. the corner market")}"><p class="label">${T("這是什麼地方？我們會先放好建議的約定。","What kind of place? We'll start you off.")}</p><div class="opts">${ks.map((k,i)=>`<button class="chip ${i===S.addType?"on":""}" data-addtype="${i}">${esc(L(DATA.types[k]))}</button>`).join("")}</div><p class="label">${T("會先放好這些約定，之後都可以改：","These come first. You can change them later:")}</p><div class="ghosts" style="gap:5px">${DATA.rules[ks[S.addType]].map(r=>`<p class="hint" style="font-size:15px;margin:0">・${LB(r)}</p>`).join("")}</div></div><div class="foot"><button class="btn" data-act="addplace" ${S.newName.trim()?"":"disabled"}>${T("建立","Create")}</button></div></div>`},
editplace(){const p=places[S.place];const sug=DATA.rules[p.type].filter(r=>!p.rules.includes(r));const w=/不要|不可以|不能|不准|別/.test(S.custom||"");return `<div class="scr">${bar(S.fromCheck?"check1":"places")}<div class="body"><div class="pl" style="width:150px;align-self:center;min-height:0" aria-hidden="true"><span class="shopb">${shopArt(p.type,pn(p))}</span></div><label class="label" style="display:flex;flex-direction:column;gap:6px">${T("招牌上的名字（最多 6 個中文字或 12 個英文字）","Sign name (up to 12 letters)")}<input class="inp" id="pname" value="${esc(p.name)}"></label><p class="label">${T("這是什麼地方？","What kind of place?")}</p><div class="opts">${Object.keys(DATA.types).map(k=>`<button class="chip ${k===p.type?"on":""}" data-settype="${k}">${esc(L(DATA.types[k]))}</button>`).join("")}</div>${S.typeAsk?`<p class="tip">${T("換成「"+esc(DATA.types[S.typeAsk].zh)+"」，這裡的約定和小任務會換成它的預設。再按一次確定。","This replaces promises and jobs with the new defaults. Tap again to confirm.")}</p>`:""}<h1 style="font-size:23px">${T("這裡的約定","Promises here")}</h1>${p.rules.map((r,i)=>`<div class="ru" style="padding:9px 12px"><span>${LB(r)}</span><button class="rm" data-rmrule="${i}" aria-label="${T("刪除","Delete")}">×</button></div>`).join("")}${p.type==="school"?`<label class="label" style="display:flex;flex-direction:column;gap:6px">${T("放學時間","Dismissal time")}<input class="inp" id="schoolEnd" type="time" value="${esc(p.schoolEnd)}"></label>`:""}<p class="label">${S.fromLast?T("這是上次想改的，改好就加進去。","From last time. Edit it, then add."):T("自己寫一條","Write your own")}</p><input class="inp" id="custom" value="${esc(S.custom||"")}" placeholder="${T("寫孩子要怎麼做","What should your child do?")}">${w?`<p class="tip">${T("換成「要怎麼做」，孩子比較知道該做什麼。例如「不要跑」改成「用走的」。","Say what to do instead. \"Don't run\" becomes \"Walk\".")}</p>`:""}${(S.custom||"").trim()?`<button class="btn ghost" data-act="addcustom" style="flex:none">${T("加進約定","Add promise")}</button>`:""}<p class="label">${T("建議的約定，點一下就加進去。","Suggestions. Tap to add.")}</p><div class="ghosts">${sug.map(r=>`<button class="gh" data-addrule="${DATA.rules[p.type].indexOf(r)}">${LB(r)}</button>`).join("")||`<p class="hint">${T("這一類的建議都加完了。","All added.")}</p>`}</div><h2 class="mon" style="margin-top:10px">${T("這裡的小任務","Small jobs here")}</h2>${p.jobs.map((r,i)=>`<div class="ru" style="padding:9px 12px"><span>${LB(r)}</span><button class="rm" data-rmjob="${i}" aria-label="${T("刪除","Delete")}">×</button></div>`).join("")}<input class="inp" id="cjob" value="${esc(S.customJob)}" placeholder="${T("自己寫一個小任務","Write your own job")}"><button class="btn ghost" data-act="addjob" style="flex:none">${T("加進小任務","Add job")}</button><button class="linkb" style="margin-top:10px" data-act="delplace">${S.delAsk?T("確定刪除？約定和小任務會一起刪掉，再按一次","Delete with its promises? Tap again"):T("刪除這個地方","Delete this place")}</button></div>${S.fromCheck?`<div class="foot"><button class="btn" data-go="check1">${T("改好了，繼續","Done, continue")}</button></div>`:""}</div>`},
check1(){const p=places[S.place];const rows=DATA.status;const tips=rows.map(r=>r.opts[S.st[r.key]??-1]).filter(o=>o&&o.tip);return `<div class="scr">${bar("places")}<div class="body"><div class="steps"><i class="on"></i><i></i><i></i></div><h1 style="font-size:23px">${T(esc(pn(p))+"｜先看今天的狀態","Going to "+esc(pthe(p))+"<br>How is everyone feeling today?")}</h1><p class="lead" style="margin-top:-6px">${T("這一頁爸媽來選。","Grown-ups choose here.")}</p>${p.last?`<div class="lastnote"><p style="margin:0 0 8px">${T("上次想改：","Last time: ")}${both({zh:p.last})}</p><button class="btn ghost" style="flex:none;font-size:16px;padding:7px" data-act="addlast">${T("加進約定","Add as a promise")}</button></div>`:""}${rows.map(r=>`<div><p class="rowt">${esc(L(r))}</p><div class="opts">${r.opts.map((o,i)=>`<button class="chip ${o.tip?"warn":""} ${S.st[r.key]===i?"on":""}" data-st="${r.key}" data-i="${i}">${esc(L(o))}</button>`).join("")}</div></div>`).join("")}${tips.map(o=>`<p class="tip">${nb(L(o.tip))}</p>`).join("")}</div><div class="foot"><button class="btn" data-step="2">${T("下一步","Next")}</button></div></div>`},
check2(){const p=places[S.place];return `<div class="scr">${bar("check1")}<div class="body"><div class="steps"><i class="on"></i><i class="on"></i><i></i></div><h1 style="font-size:23px">${T("今天要約哪幾條？","Which promises today?")}</h1><p class="lead" style="margin-top:-6px">${DATA.status.some(r=>{const o=r.opts[S.st[r.key]];return o&&o.tip})?T("今天狀態不太好，建議 3 條以內比較做得到。","Not the best day. Up to 3 is easier to keep."):T("建議 3 條左右，也可以多選。","About 3 works well, and you can pick more.")}</p>${p.rules.map((r,i)=>`<button class="ru ${S.pick.includes(i)?"on":""}" data-pick="${i}"><span class="ck">${S.pick.includes(i)?CK:""}</span><span>${LB(r)}</span></button>`).join("")}<input class="inp" id="crule" value="${esc(S.customRule||"")}" placeholder="${T("再加一條（寫孩子要怎麼做）","Add one (what should your child do?)")}"><button class="btn ghost" style="flex:none" data-act="addpick">${T("加進今天的約定","Add to today")}</button><p class="rowt" style="margin-top:4px">${ifLabel(p)}</p><div class="ghosts" style="gap:6px">${p.ifnot.map((o,i)=>`<button class="ru ${S.ifnot===i?"on":""}" style="padding:8px 12px;font-size:16px" data-ifnot="${i}"><span>${LB(o)}</span></button>`).join("")}</div><input class="inp" id="cif" value="${esc(S.customIf||"")}" placeholder="${T("自己寫一個","Write your own")}"><button class="btn ghost" style="flex:none" data-act="addif">${T("加進選項","Add option")}</button><p class="hint">${p.type==="school"?T("爸媽不在現場，選一個放學後接得上的。","You won't be there. Choose one you can pick up after school."):T("選一個你今天真的做得到的。","Choose one you can really follow through on today.")}</p></div><div class="foot"><button class="btn" data-step="3" ${S.pick.length?"":"disabled"}>${T("請孩子來看","Show my child")}</button></div></div>`},
check3(){const p=places[S.place];const all=S.pick.length&&S.pick.every(i=>S.done.includes(i)),needEnd=p.type==="school"&&etaSet(p)[S.eta].end!==undefined&&!p.schoolEnd;return `<div class="scr">${bar("check2")}<div class="body"><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><h1 style="font-size:24px">${T("到 <em>"+esc(pn(p))+"</em>，我們約好","At <em>"+esc(pthe(p))+"</em>, we promise")}</h1>${S.pick.map(i=>`<button class="ru big ${S.done.includes(i)?"on":""}" data-done="${i}"><span class="ck">${S.done.includes(i)?CK:""}</span><span>${LB(p.rules[i])}</span></button>`).join("")}<p class="label">${T("你打算怎麼做到？","How will you do it?")}</p><input class="inp" id="how" value="${esc(S.how)}" placeholder="${T("孩子說，爸媽打字","Your child says it, you type it")}"><p class="tip">${ifLabel(p)}${T("：",": ")}${LB(p.ifnot[S.ifnot]||p.ifnot[0])}</p><p class="label">${T("今天的小任務（可以不選）","Today's small job (optional)")}</p><div class="opts" style="grid-template-columns:1fr">${p.jobs.map((j,i)=>`<button class="chip ${S.job===i?"on":""}" data-job="${i}" style="padding:7px 10px">${LB(j)}</button>`).join("")}</div><p class="label">${p.type==="school"?T("什麼時候提醒你記錄？","When should we remind you?"):T("多久後提醒你記錄？","When should we remind you?")}</p><div class="opts etas">${etaSet(p).map((e,i)=>`<button class="chip ${S.eta===i?"on":""}" data-eta="${i}">${esc(L(e))}</button>`).join("")}</div>${p.type==="school"&&etaSet(p)[S.eta].end!==undefined?`<label class="label" style="display:flex;flex-direction:column;gap:6px">${p.schoolEnd?T("這間學校的放學時間（會記下來）","Dismissal time (saved)"):T("這間學校幾點放學？填一次就會記下來。","What time does school end? We'll save it.")}<input class="inp" id="schoolEnd" type="time" value="${esc(p.schoolEnd)}"></label>`:""}${etaSet(p)[S.eta].custom?`<p class="label">${T("幾點提醒你？","What time?")}</p><input class="inp" id="etaT" type="time" value="${esc(S.etaT||"")}" aria-label="${T("提醒時間","Reminder time")}">`:""}</div><div class="foot"><button class="btn ${all&&!needEnd?"":"wait" let swipeNav=false,sw=null;
function swipeBlocked(t){return !!app.querySelector(".ov,.sf,.coach")||!!document.getElementById("mach")?.dataset.busy||(t&&t.closest&&!!t.closest("textarea,input,.seg"))}
app.addEventListener("touchstart",e=>{sw=null;if(e.touches.length!==1||swipeBlocked(e.target))return;const p=e.touches[0],edge=!isInstalled()&&p.clientX<22;if(edge)return;const scr=app.querySelector(":scope>.scr");if(!scr)return;sw={x:p.clientX,y:p.clientY,dx:0,lock:false,scr,w:scr.getBoundingClientRect().width,back:scr.querySelector(".bar .bk"),inner:e.target.closest?e.target.closest(".wallv,.tabs2,.starbox"):null}},{passive:true});
app.addEventListener("touchmove",e=>{if(!sw)return;const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y;if(!sw.lock){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){const v=sw.inner;if(v&&v.scrollWidth>v.clientWidth+2&&(dx<0||v.scrollLeft>2)){sw=null;return}sw.lock=true}else if(Math.abs(dy)>12){sw=null;return}else return}const ok=dx>0?!!sw.back:!!S.fwd;sw.dx=dx;sw.ok=ok;sw.scr.style.transition="none";sw.scr.style.transform=`translateX(${ok?dx:dx*.18}px)`},{passive:true});
function swipeSettle(){if(!sw)return;const s=sw;sw=null;if(!s.lock)return;const far=Math.abs(s.dx)>Math.min(90,s.w*.26);if(!s.ok||!far||!s.scr.isConnected){s.scr.style.transition="transform .22s cubic-bezier(.2,1.2,.4,1)";s.scr.style.transform="translateX(0)";return}const dir=s.dx>0?1:-1;s.scr.style.transition="transform .17s ease-out";s.scr.style.transform=`translateX(${dir*s.w}px)`;setTimeout(()=>{const from=S.screen;swipeNav=true;if(dir>0){s.back.click();S.fwd=S.screen!==from?from:null}else{const to=S.fwd;S.fwd=null;pop();nav(to)}swipeNav=false;const n=app.querySelector(":scope>.scr");if(n&&!noMotion())n.animate([{transform:`translateX(${-dir*44}px)`,opacity:.55},{transform:"translateX(0)",opacity:1}],{duration:190,easing:"ease-out"})},170)}
app.addEventListener("touchend",swipeSettle,{passive:true});
app.addEventListener("touchcancel",()=>{if(sw){sw.dx=0;swipeSettle()}},{passive:true});

const COACH={
 home:[{t:["歡迎！這裡是爸媽和孩子一起用的小工具。我帶你看一下，很快。","Welcome! This is for you and your child. A quick look around."]},
  {sel:'[data-go="places"]',t:["我們要出門：出發前跟孩子一起約好，孩子自己打勾。","We're going out: agree on a few things before you leave. Your child ticks them."]},
  {sel:'[data-go="wins"]',t:["小小戰績：孩子做到的小事貼上牆，每 10 件可以換一顆星星。","Little Wins: your child's small wins go on a wall. Every 10 can become a star."]},
  {sel:'[data-go="machine"]',tap:true,t:["看見你的好：看到孩子做了什麼，就放進扭蛋機。點這裡進去看看。","The good I saw: put what you noticed into the machine. Tap here to look."]}],
 machine:[{sel:'[data-go="add"]',t:["先放一顆：寫下今天看到孩子做了什麼，打字或用鍵盤語音都可以。","Add one: write what you saw today. Type or use keyboard dictation."]},
  {sel:'[data-act="knob"]',t:["孩子點旋鈕就會轉，掉出來的扭蛋打開，就是你寫的字條。點玻璃和蓋子也會動。每天可以轉幾顆，到家長設定調。","Your child taps the knob to turn it and opens your note. The glass and lid move too. Set how many per day in settings."]},
  {sel:'[data-go="book"]',t:["打開過的字條都收在收藏冊，隨時能再看。","Opened notes stay in the collection."]},
  {t:["還有一個小秘訣：不用按左上角，往右滑就能回上一頁。","One more tip: swipe right to go back."]}],
 add:[{sel:'.ghosts',t:["不知道怎麼寫？點一句灰色的句子放進去，再改成你家的事。","Not sure what to write? Tap a grey line, then make it yours."]}],
 places:[{sel:'.places',t:["點要去的地方，就會開始今天的約定。每個地方都放好了建議。","Tap where you're going to start today's promises. Suggestions are ready."]},
  {sel:'[data-act="editmode"]',t:["想改店名或約定，按這裡。","Change names or promises here."]}],
 check3:[{sel:'.ru.big',t:["這一頁請孩子來：自己一條一條打勾，再說說打算怎麼做到。","This page is for your child: tick each one and say how they'll do it."]}],
 wins:[{sel:'.wallv',t:["孩子做到的小事都在這面牆上。貼滿了可以左右滑，看更多。","Your child's wins live on this wall. Swipe sideways when it fills up."]},
  {sel:'[data-go="winsadd"]',t:["今天做到什麼，從這裡放進來，一行一件。","Add today's wins here, one per line."]},
  {sel:'.starbox',t:["每 10 件可以換一顆星星，孩子自己挑。點星星能再看裡面的小事。","Every 10 can become a star. Your child picks which. Tap a star to read them."]}],
 settings:[{sel:'[data-act="backup"]',t:["資料只存在這支手機，換手機前先備份一份。","Everything stays on this phone. Back up before you switch."]}]
};
function maybeCoach(){if(MODE!=="web"||S.coachOff||app.querySelector(".ov,.sf,.coach")||document.getElementById("mach")?.dataset.busy)return;const k=S.screen;S.seen=S.seen||{};if(!COACH[k]||S.seen[k])return;if(k!=="home"&&!S.seen.home)return;S.seen[k]=1;saveNow();runCoach(COACH[k])}
function runCoach(steps){let i=0;const c=document.createElement("div");c.className="coach";app.append(c);const end=()=>{c.remove();saveNow()};
 const show=()=>{let st=steps[i];let el=st.sel?app.querySelector(st.sel):null;while(st.sel&&(!el||!el.getClientRects().length)){i++;if(i>=steps.length)return end();st=steps[i];el=st.sel?app.querySelector(st.sel):null}
  if(el)el.scrollIntoView({block:"center"});
  setTimeout(()=>{const a=c.getBoundingClientRect(),r=el?el.getBoundingClientRect():null,pad=7,last=i===steps.length-1;let hole="",pos;
   if(r){const top=r.top-a.top-pad,left=Math.max(4,r.left-a.left-pad),w=Math.min(a.width-8-left,r.width+pad*2),h=r.height+pad*2;hole=`<div class="chole" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px"></div>`;pos=(r.top+r.height/2-a.top)<a.height*.5?`top:${Math.min(top+h+14,a.height-230)}px`:`bottom:${Math.min(a.height-top+14,a.height-230)}px`}else pos=`top:${a.height*.28}px`;
   c.classList.toggle("dim",!r);c.innerHTML=`${hole}<div class="cbub" style="${pos}"><img src="${IMG.wave}" alt=""><p>${esc(T(st.t[0],st.t[1]))}</p><div class="crow"><button class="cskip" data-c="skip">${T("先不用看","Skip")}</button>${st.tap?"":`<button class="btn cnext" data-c="next">${last?T("知道了","Got it"):T("下一步","Next")}</button>`}</div></div>`;
   c.querySelectorAll(".cbub").forEach(b=>{if(!noMotion())b.animate([{opacity:0,translate:"0 10px"},{opacity:1,translate:"0 0"}],{duration:180,easing:"ease-out"})})},el?40:0)};
 c.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("[data-c]"),h=e.target.closest(".chole");if(b&&b.dataset.c==="skip"){pop();S.coachOff=true;return end()}if(b&&b.dataset.c==="next"){pop();i++;return i<steps.length?show():end()}if(h){const st=steps[i],el=st.sel&&app.querySelector(st.sel);if(st.tap&&el){c.remove();saveNow();el.click();return}}});
 show()}
render();
checkRemind();
setTimeout(maybeCoach,500);
</script>
